services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    # On macOS / Docker Desktop, bridge mode with explicit ports is required because
    # host mode does not route to the macOS host network.
    ports:
      - 32400:32400/tcp
      - 1900:1900/udp
      - 8324:8324/tcp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
      - 32469:32469/tcp
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
      - VERSION=docker
      # PLEX_CLAIM token is only needed on first run and expires after 4 minutes.
      # Get one at https://plex.tv/claim. Leave blank on subsequent runs.
      - PLEX_CLAIM=${PLEX_CLAIM}
    # Note: /dev/dri is for Linux Intel QuickSync. Commented out for macOS compatibility:
    # devices:
    #   - /dev/dri:/dev/dri
    volumes:
      - ./plex:/config
      - ${DATA_DIR:-../data}:/data
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./tautulli:/config
    ports:
      - 8181:8181
    restart: unless-stopped
