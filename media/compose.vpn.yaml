# ==============================================================================
# Homelab Media Stack with Plex Server (Surfshark VPN / Protected Mode)
# ==============================================================================
# In this mode, qBittorrent, NZBGet, Prowlarr, and FlareSolverr are routed
# securely through the Gluetun VPN container using Surfshark credentials in .env.
#
# To run this stack:
#   docker compose -f compose.vpn.yaml up -d
# ==============================================================================

networks:
  servarrnetwork:
    name: servarrnetwork
    ipam:
      config:
        - subnet: 172.39.0.0/24

services:
  # ----------------------------------------------------------------------------
  # Gluetun VPN Client (Surfshark)
  # ----------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_GLUETUN:-172.39.0.2}
        aliases:
          - qbittorrent
          - prowlarr
          - flaresolverr
          - nzbget
    ports:
      - 8080:8080 # qbittorrent web interface
      - 6881:6881 # qbittorrent torrent port
      - 6881:6881/udp
      - 6789:6789 # nzbget
      - 9696:9696 # prowlarr
      - 8191:8191 # flaresolverr
    volumes:
      - ./gluetun:/gluetun
    env_file:
      - .env
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Download Clients (Routed via Gluetun)
  # ----------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${FIREWALL_VPN_INPUT_PORTS:-6881}
    volumes:
      - ./qbittorrent:/config
      - ${DATA_DIR:-./data}:/data
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 10s

  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=${TZ:-Asia/Kolkata}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./nzbget:/config
      - ${DATA_DIR:-./data}:/data
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./prowlarr:/config
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ:-Asia/Kolkata}
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun

  # ----------------------------------------------------------------------------
  # Media Server & Monitoring
  # ----------------------------------------------------------------------------
  # NOTE: Native macOS "Plex Media Server.app" is already running on your Mac
  # and reachable from Docker containers at: http://host.docker.internal:32400
  # To run Plex in Docker instead, quit the native app and run:
  #   docker compose -f compose.vpn.yaml --profile docker-plex up -d
  plex:
    profiles: ["docker-plex"]
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    ports:
      - 32400:32400/tcp
      - 1900:1900/udp
      - 8324:8324/tcp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
      - 32469:32469/tcp
    volumes:
      - ./plex:/config
      - ${DATA_DIR:-./data}:/data
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_PLEX:-172.39.0.10}

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
      - JELLYFIN_PublishedServerUrl=http://100.98.133.76:8096
    volumes:
      - ./jellyfin/config:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 1900:1900/udp
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_JELLYFIN:-172.39.0.12}

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./tautulli:/config
    ports:
      - 8181:8181
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_TAUTULLI:-172.39.0.11}

  # ----------------------------------------------------------------------------
  # *arr Automation Services
  # ----------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./sonarr:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - 8989:8989
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_SONARR:-172.39.0.3}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./radarr:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - 7878:7878
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_RADARR:-172.39.0.4}

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./lidarr:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - 8686:8686
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_LIDARR:-172.39.0.5}

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./bazarr:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - 6767:6767
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_BAZARR:-172.39.0.6}

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-Asia/Kolkata}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    volumes:
      - ./seerr:/app/config
    ports:
      - 5055:5055
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_SEERR:-172.39.0.7}

  # ----------------------------------------------------------------------------
  # Caddy Reverse Proxy & Automatic SSL (Let's Encrypt)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      servarrnetwork:
        ipv4_address: ${SET_IP_CADDY:-172.39.0.30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
